name: Refresh engineering profile metrics

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  # The built-in token can write only to this profile repository.
  # Cross-repository access is provided separately by the read-only secret.
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Calculate private-safe metrics and update profile
        uses: actions/github-script@v8
        env:
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
        with:
          github-token: ${{ github.token }}
          script: |
            const readToken = process.env.PROFILE_READ_TOKEN;
            if (!readToken) {
              core.setFailed("Missing PROFILE_READ_TOKEN. Add the repository secret described in METRICS_SETUP.md, then rerun this workflow.");
              return;
            }

            // Use the built-in fetch API for read-only cross-repository requests.
            // The GitHub Script-provided Octokit client (github) is used only to write
            // generated files back to this profile repository.
            const readApi = async path => {
              const all = [];
              let url = `https://api.github.com${path}`;
              while (url) {
                const response = await fetch(url, {
                  headers: {
                    Authorization: `Bearer ${readToken}`,
                    Accept: "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28"
                  }
                });
                if (!response.ok) {
                  const body = await response.text();
                  throw new Error(`GitHub read API failed (${response.status}) for ${url}: ${body.slice(0, 300)}`);
                }
                const data = await response.json();
                if (!Array.isArray(data)) return data;
                all.push(...data);
                const link = response.headers.get("link") || "";
                const next = link.split(",").find(part => part.includes('rel="next"'));
                url = next ? next.match(/<([^>]+)>/)?.[1] || "" : "";
              }
              return all;
            };
            // github-script's built-in client uses the short-lived repository-scoped GITHUB_TOKEN.
            const write = github;
            const owner = "janarthananRaja";
            const profileRepo = "janarthananRaja";
            // Verified GitHub usernames used for authored commits.
            const authorIdentities = ["janarthananRaja", "Janarthanan9751"];
            const now = new Date();
            const since = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
            const iso = d => d.toISOString().slice(0, 10);
            const escapeSvg = value => String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/\x27/g, "&apos;");
            const escapeHtml = value => String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/\x27/g, "&#39;");

            let repos;
            try {
              repos = await readApi("/user/repos?per_page=100&affiliation=owner&sort=updated&direction=desc");
            } catch (e) {
              core.setFailed(`Could not list repositories. Check PROFILE_READ_TOKEN validity and repository access. Details: ${e.message}`);
              return;
            }
            const owned = repos.filter(r => r.owner.login.toLowerCase() === owner.toLowerCase() && !r.archived);
            let totalCommits = 0;
            let commits30d = 0;
            let activeRepos30d = 0;
            const publicRecent = [];
            const privateCategories = new Map();
            const classify = message => {
              const m = (message || "").toLowerCase();
              if (/auth|token|rbac|permission|security|identity|oauth/.test(m)) return "Security & identity";
              if (/angular|react|frontend|component|css|layout|dashboard|ui|ux/.test(m)) return "Frontend & product UI";
              if (/spring|java|backend|api|endpoint|service|controller/.test(m)) return "Backend & API engineering";
              if (/sql|database|postgres|mysql|analytics|metric|report|query/.test(m)) return "Data & analytics";
              if (/test|bug|fix|build|ci|workflow|deploy|refactor|performance/.test(m)) return "Quality, reliability & delivery";
              return "General product engineering";
            };

            for (const repo of owned) {
              if (!repo.default_branch) continue;
              if (repo.size === 0) continue; // Empty repositories have no commit history.
              let commits = [];
              try {
                // Scan every branch, then deduplicate by commit SHA so shared history
                // is not counted repeatedly when branches point to the same commits.
                const branches = await readApi(`/repos/${owner}/${encodeURIComponent(repo.name)}/branches?per_page=100`);
                const commitsBySha = new Map();
                for (const branch of branches) {
                  const params = new URLSearchParams({
                    sha: branch.name,
                    per_page: "100"
                  });
                  const branchCommits = await readApi(`/repos/${owner}/${encodeURIComponent(repo.name)}/commits?${params.toString()}`);
                  for (const commit of branchCommits) {
                    if (commit?.sha && authorIdentities.includes(commit.author?.login)) commitsBySha.set(commit.sha, commit);
                  }
                }
                commits = [...commitsBySha.values()];
              } catch (e) {
                // Fail closed: never publish misleading partial totals when access is missing.
                core.setFailed("Could not read branches or commit history for every owned repository. Check PROFILE_READ_TOKEN repository access and Contents: read permission. No metrics were published.");
                return;
              }
              totalCommits += commits.length;
              const recent = commits.filter(c => c.commit?.author?.date && new Date(c.commit.author.date) >= since && new Date(c.commit.author.date) <= now);
              commits30d += recent.length;
              if (recent.length) activeRepos30d++;

              if (repo.private) {
                if (recent.length) {
                  for (const c of recent) {
                    const category = classify(c.commit?.message);
                    const item = privateCategories.get(category) || { count: 0, latest: c.commit?.author?.date || "" };
                    item.count++;
                    if (c.commit?.author?.date && (!item.latest || c.commit.author.date > item.latest)) item.latest = c.commit.author.date;
                    privateCategories.set(category, item);
                  }
                }
              } else {
                for (const c of recent.slice(0, 2)) {
                  publicRecent.push({
                    date: c.commit.author.date,
                    repo: repo.name,
                    message: (c.commit.message || "Commit").split("\n")[0].replace(/[<>]/g, "").slice(0, 100),
                    url: c.html_url
                  });
                }
              }
            }

            publicRecent.sort((a, b) => new Date(b.date) - new Date(a.date));
            const publicCount = owned.filter(r => !r.private).length;
            const privateCount = owned.filter(r => r.private).length;
            let recentHtml = "";
            if (publicRecent.length) {
              recentHtml = publicRecent.slice(0, 5).map(c =>
                `<tr><td><a href="${escapeHtml(c.url)}">${escapeHtml(c.message)}</a></td><td><a href="https://github.com/${owner}/${encodeURIComponent(c.repo)}">${escapeHtml(c.repo)}</a></td><td>${iso(new Date(c.date))}</td></tr>`
              ).join("\n");
            } else {
              recentHtml = '<tr><td colspan="3">No public commits recorded in the last 30 days.</td></tr>';
            }

            const privateRows = [...privateCategories.entries()]
              .sort((a, b) => new Date(b[1].latest) - new Date(a[1].latest))
              .slice(0, 4)
              .map(([category, data]) => `<tr><td>${escapeHtml(category)}</td><td>${data.count}</td><td>${iso(new Date(data.latest))}</td></tr>`)
              .join("\n") || '<tr><td colspan="3">No private-repository commits recorded in the last 30 days.</td></tr>';

            const historicalCommits = totalCommits - commits30d;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
              <title id="title">Engineering telemetry</title><desc id="desc">Repository and commit metrics updated ${iso(now)}. Private repository names and commit messages are not shown.</desc>
              <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fc"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
              <rect width="1200" height="390" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="388" rx="21" fill="none" stroke="#d9e4f2"/>
              <rect x="28" y="25" width="5" height="18" rx="2" fill="url(#accent)"/><text x="48" y="39" fill="#334155" font-family="monospace" font-size="15" letter-spacing="1.5">ENGINEERING TELEMETRY</text><text x="1170" y="39" text-anchor="end" fill="#64748b" font-family="monospace" font-size="12">UPDATED ${iso(now)}</text>
              <g transform="translate(28 65)"><rect width="364" height="180" rx="15" fill="#fff" stroke="#dbe5f0"/><rect width="364" height="4" rx="2" fill="url(#accent)"/><text x="24" y="36" fill="#64748b" font-family="monospace" font-size="13" letter-spacing="1.2">01 / REPOSITORY INVENTORY</text><text x="24" y="100" fill="#0f172a" font-family="monospace" font-weight="700" font-size="42">${owned.length}</text><text x="24" y="133" fill="#475569" font-family="sans-serif" font-size="14">Current owned-repository total</text><text x="24" y="158" fill="#2563eb" font-family="sans-serif" font-size="13">${publicCount} public / ${privateCount} private</text></g>
              <g transform="translate(418 65)"><rect width="364" height="180" rx="15" fill="#fff" stroke="#dbe5f0"/><rect width="364" height="4" rx="2" fill="url(#accent)"/><text x="24" y="36" fill="#64748b" font-family="monospace" font-size="13" letter-spacing="1.2">02 / AUTHORED COMMITS - ALL TIME</text><text x="24" y="100" fill="#0f172a" font-family="monospace" font-weight="700" font-size="42">${totalCommits.toLocaleString("en-US")}</text><text x="24" y="133" fill="#475569" font-family="sans-serif" font-size="14">Commits across owned repos and branches</text><text x="24" y="158" fill="#2563eb" font-family="sans-serif" font-size="13">Attributed by GitHub author identity</text></g>
              <g transform="translate(808 65)"><rect width="364" height="180" rx="15" fill="#fff" stroke="#dbe5f0"/><rect width="364" height="4" rx="2" fill="url(#accent)"/><text x="24" y="36" fill="#64748b" font-family="monospace" font-size="13" letter-spacing="1.2">03 / RECENT AUTHORED COMMITS</text><text x="24" y="100" fill="#0f172a" font-family="monospace" font-weight="700" font-size="42">${commits30d.toLocaleString("en-US")}</text><text x="24" y="133" fill="#475569" font-family="sans-serif" font-size="14">Within the rolling 30 days ending at snapshot time</text><text x="24" y="158" fill="#2563eb" font-family="sans-serif" font-size="13">${activeRepos30d} active repositories</text></g>
              <g transform="translate(808 255)"><rect width="364" height="110" rx="15" fill="#fff" stroke="#dbe5f0"/><rect width="364" height="4" rx="2" fill="#d97706"/><text x="24" y="32" fill="#64748b" font-family="monospace" font-size="13" letter-spacing="1.2">04 / HISTORICAL COMMITS</text><text x="24" y="73" fill="#0f172a" font-family="monospace" font-weight="700" font-size="30">${historicalCommits.toLocaleString("en-US")}</text><text x="24" y="94" fill="#d97706" font-family="sans-serif" font-size="12">All-time minus recent · older than 30 days</text></g>
            </svg>`;
            
            const section = `<!-- PROFILE_METRICS_START -->
            <div align="center">

            <img src="https://raw.githubusercontent.com/${owner}/${profileRepo}/main/metrics.svg" width="100%" alt="Live engineering telemetry: current repository inventory, all-time authored commits across scanned branches, and commits from the last 30 days"/>

            <sub>Updated ${iso(now)} · Repositories = current inventory · Authored commits = all-time scanned history · Recent activity and private themes = last 30 days</sub>

            </div>

            ### Recent public work

            <table>
            <tr><th>Commit</th><th>Repository</th><th>Date</th></tr>
            ${recentHtml}
            </table>

            ### Private engineering themes · sanitized (last 30 days)

            <table>
            <tr><th>Work area</th><th>Commits</th><th>Latest</th></tr>
            ${privateRows}
            </table>

            <sub>Private activity is included in aggregate totals. Repository names and raw private commit messages are never published. Work areas are inferred from commit subjects and may be approximate.</sub>

            <!-- PROFILE_METRICS_END -->`;

            const file = await write.rest.repos.getContent({ owner, repo: profileRepo, path: "README.md" });
            const current = Buffer.from(file.data.content, "base64").toString("utf8");
            const start = "<!-- PROFILE_METRICS_START -->";
            const end = "<!-- PROFILE_METRICS_END -->";
            const a = current.indexOf(start);
            const b = current.indexOf(end);
            if (a < 0 || b < a) {
              core.setFailed("README.md is missing the profile metrics markers.");
              return;
            }
            const updated = current.slice(0, a) + section + current.slice(b + end.length);
            await write.rest.repos.createOrUpdateFileContents({
              owner,
              repo: profileRepo,
              path: "README.md",
              message: "chore: refresh live engineering profile metrics",
              sha: file.data.sha,
              content: Buffer.from(updated).toString("base64")
            });

            const svgFile = await write.rest.repos.getContent({ owner, repo: profileRepo, path: "metrics.svg" });
            await write.rest.repos.createOrUpdateFileContents({
              owner,
              repo: profileRepo,
              path: "metrics.svg",
              message: "chore: refresh engineering telemetry dashboard",
              sha: svgFile.data.sha,
              content: Buffer.from(svg).toString("base64")
            });
            core.info(`Updated profile metrics successfully. Repositories scanned: ${owned.length}; authored commits counted: ${totalCommits}. Tokens were not logged.`);
