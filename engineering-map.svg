<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Engineering capability map</title><desc id="desc">A visual map of product engineering across interface, API, identity, data, reliability, and delivery, plus eight sanitized project categories.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#06b6d4"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#334155" flood-opacity=".08"/></filter>
 <style>
 .k{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#64748b}.h{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#14213d}.sub{font:400 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}.node{font:700 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#172554}.nodeSub{font:400 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}.chip{font:700 10px system-ui,-apple-system,Segoe UI,sans-serif;fill:#315b9e}.proj{font:700 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#172554}.projSub{font:400 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}
 .pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
 </style>
</defs>
