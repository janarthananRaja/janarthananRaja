<text x="40" y="48" class="k">JANARTHANAN RAJA / ENGINEERING MAP</text><text x="40" y="83" class="h" font-size="25">From interaction to reliable systems.</text><text x="40" y="108" class="sub">A practical view of the layers I connect when building product software.</text>
